[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "restea"
dynamic = ["version"]
description = "Simple RESTful server toolkit"
readme = "README.rst"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Walery Jadlowski", email = "bodb.digr@gmail.com" },
]
keywords = ["rest", "restful", "restea"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "mock>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "mock>=5.0",
]

[project.urls]
Homepage = "https://github.com/bodbdigr/restea"
Repository = "https://github.com/bodbdigr/restea"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.hatch.build.targets.sdist]
include = [
    "/restea",
    "/README.rst",
]

[tool.hatch.build.targets.wheel]
packages = ["restea"]

[tool.pytest.ini_options]
addopts = "--cov-report=term-missing --cov=restea"
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["restea"]
